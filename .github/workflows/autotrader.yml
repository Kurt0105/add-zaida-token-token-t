name: Autotrader

# Paper-money trading bot (see autotrader/README.md). No secrets, no real orders.
on:
  schedule:
    - cron: "17 0 * * *" # daily tick, just after the daily price bar closes (UTC)
    - cron: "47 0 * * 1" # weekly settings test + evidence report (Mondays)
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [tick, tune]
        default: tick

permissions:
  contents: write # the bot saves its journal back to the repo

concurrency:
  group: autotrader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '47 0 * * 1' && 'tune' || 'tick') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (never trade on broken code)
        run: python -m unittest discover -s autotrader/tests -t .
      - name: Run
        run: python -m autotrader "$JOB"
      - name: Save state
        if: always()
        run: |
          git config user.name "autotrader-bot"
          git config user.email "autotrader-bot@users.noreply.github.com"
          git add autotrader/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "autotrader: $JOB $(date -u +%F)"
          git pull --rebase
          git push
